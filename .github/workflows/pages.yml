name: Deploy to GitHub Pages

# 部署到 gh-pages 分支。
# （原先用 actions/deploy-pages + configure-pages，但仓库未启用 Pages 时
#   configure-pages 必失败 —— 启用 Pages 是仓库设置层面的动作，工作流改不动它。
#   推到分支则不会失败：你在 Settings → Pages 里把 Source 选成 gh-pages 分支即可生效。）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: 生成版本号
        run: node tools/build-version.js

      - name: 组装站点
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js version.json _site/
          cp -r assets src _site/
          # 站点里只保留 PWA 图标，截图不必上线
          rm -rf _site/assets/screenshots
          ls _site

      - name: 推送到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
